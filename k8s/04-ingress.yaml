apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: usermgmt-02230153
spec:
  ingressClassName: nginx
  rules:
    - host: usermgmt-02230153.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80
